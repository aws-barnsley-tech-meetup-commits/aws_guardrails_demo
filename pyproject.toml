[project]
name = "guardrails-demo"
version = "0.1.0"
description = "Guardrails demo challenges. C1: Break the Bot."
requires-python = ">=3.13,<3.14"

dependencies = [
    # Agent (also vendored into the AgentCore code bundle)
    "strands-agents==1.56.0",
    "bedrock-agentcore==1.23.1",
    # API / judge / smoke test
    "boto3==1.43.99",
    # Infrastructure
    "aws-cdk-lib==2.270.0",
    "constructs==10.8.1",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["c1/tests"]
pythonpath = ["."]

[tool.uv]
package = false
